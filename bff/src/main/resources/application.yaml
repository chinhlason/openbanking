spring:
  application:
    name: bff
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: client
              uri: ${BFF_ROUTE_CLIENT_URI:http://localhost:8081}
              predicates:
                - Path=/client/**
              filters:
                - StripPrefix=3
            - id: common
              uri: ${BFF_ROUTE_COMMON_URI:http://localhost:8083}
              predicates:
                - Path=/common/**
              filters:
                - StripPrefix=3
                - PrefixPath=/common/api
            - id: auth
              uri: ${BFF_ROUTE_AUTH_URI:http://localhost:8084}
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=3
                - PrefixPath=/auth/api
            - id: core
              uri: ${BFF_ROUTE_CORE_URI:http://localhost:8085}
              predicates:
                - Path=/core/**
              filters:
                - StripPrefix=3
                - PrefixPath=/core/api

server:
  port: 8080
  servlet:
    context-path: /bff/api

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"

tsb:
  bff:
    entitlement:
      common-url: ${BFF_ENTITLEMENT_COMMON_URL:http://localhost:8083/common/api}
      admin-key: ${BFF_ENTITLEMENT_ADMIN_KEY:local-admin-key}
      redis-channel: ${BFF_ENTITLEMENT_REDIS_CHANNEL:tsb:entitlement:changed}
    session:
      redis-key-prefix: ${BFF_SESSION_REDIS_KEY_PREFIX:tsb:auth:session:}
  shared:
    common-config:
      enabled: false
      app: bff
      profile: local
      base-url: http://localhost:8083/common/api
      api-key: ${BFF_CONFIG_API_KEY:local-config-key}
    internal-auth:
      enabled: true
      signer-enabled: true
      verifier-enabled: false
      hmac-secret: ${TSB_INTERNAL_AUTH_HMAC_SECRET:local-dev-secret}
      issuer: bff
      max-skew: 60s
    logging:
      request:
        enabled: true
        include-headers: true
        include-query-string: true
        include-body: true
        max-body-length: 4096
      response:
        include-body: true
        max-body-length: 4096
    kafka:
      enabled: false
    cache:
      enabled: false
    sequence:
      enabled: false
    tracing:
      export-enabled: true
      service-name: bff
      otlp-endpoint: ${TSB_SHARED_TRACING_OTLP_ENDPOINT:http://localhost:4317}
      export-timeout: 5s
      identity:
        enabled: ${TSB_SHARED_TRACING_IDENTITY_ENABLED:true}
        raw-values: ${TSB_SHARED_TRACING_IDENTITY_RAW_VALUES:false}
        hash-key: ${TSB_SHARED_TRACING_IDENTITY_HASH_KEY:tsb-local-trace-identity-key}
    protocol:
      discovery:
        enabled: true
        provider: consul
        consul-url: http://localhost:8500
      downstreams:
        common:
          service-id: common
          context-path: /common/api
          base-url: http://localhost:8083/common/api
          service-auth:
            enabled: ${TSB_BFF_COMMON_SERVICE_AUTH_ENABLED:false}
            client-id: ${TSB_BFF_SERVICE_CLIENT_ID:bff-service}
            client-secret: ${TSB_BFF_SERVICE_CLIENT_SECRET:local-bff-service-secret}
            token-uri: ${TSB_SERVICE_TOKEN_URI:http://localhost:8088/realms/truongsonbank/protocol/openid-connect/token}
            audience: common-service
            token-refresh-skew: 30s
            retry-on-unauthorized-once: true
        auth:
          service-id: auth
          context-path: /auth/api
          base-url: http://localhost:8084/auth/api
        client:
          service-id: client
          context-path: /client/api
          base-url: http://localhost:8081/client/api
          service-auth:
            enabled: ${TSB_BFF_CLIENT_SERVICE_AUTH_ENABLED:false}
            client-id: ${TSB_BFF_SERVICE_CLIENT_ID:bff-service}
            client-secret: ${TSB_BFF_SERVICE_CLIENT_SECRET:local-bff-service-secret}
            token-uri: ${TSB_SERVICE_TOKEN_URI:http://localhost:8088/realms/truongsonbank/protocol/openid-connect/token}
            audience: client-service
            token-refresh-skew: 30s
            retry-on-unauthorized-once: true
        core:
          service-id: core
          context-path: /core/api
          base-url: http://localhost:8085/core/api
          service-auth:
            enabled: ${TSB_BFF_CORE_SERVICE_AUTH_ENABLED:false}
            client-id: ${TSB_BFF_SERVICE_CLIENT_ID:bff-service}
            client-secret: ${TSB_BFF_SERVICE_CLIENT_SECRET:local-bff-service-secret}
            token-uri: ${TSB_SERVICE_TOKEN_URI:http://localhost:8088/realms/truongsonbank/protocol/openid-connect/token}
            audience: core-service
            token-refresh-skew: 30s
            retry-on-unauthorized-once: true
