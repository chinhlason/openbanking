spring:
  application:
    name: common
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${COMMON_DB_NAME:entitlementdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: client
    password: clientpass
  sql:
    init:
      mode: always
      continue-on-error: true
      schema-locations: classpath:entitlement-schema.sql
  data:
    redis:
      host: localhost
      port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8083
  servlet:
    context-path: /common/api

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"

tsb:
  shared:
    kafka:
      enabled: false
    cache:
      enabled: false
    sequence:
      enabled: false
    crypto:
      enabled: true
      key-id: ${TSB_CRYPTO_KEY_ID:local-v1}
      encryption-key: ${TSB_CRYPTO_ENCRYPTION_KEY:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=}
      hash-key: ${TSB_CRYPTO_HASH_KEY:YWJjZGVmMDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODk=}
    tracing:
      export-enabled: true
      service-name: common
      otlp-endpoint: http://localhost:4317
      export-timeout: 5s
      identity:
        enabled: ${TSB_SHARED_TRACING_IDENTITY_ENABLED:true}
        raw-values: ${TSB_SHARED_TRACING_IDENTITY_RAW_VALUES:false}
        hash-key: ${TSB_SHARED_TRACING_IDENTITY_HASH_KEY:tsb-local-trace-identity-key}
    logging:
      request:
        enabled: true
        include-headers: true
        include-query-string: true
        include-body: true
        max-body-length: 4096
      response:
        include-body: true
        max-body-length: 4096
    health:
      enabled: false
    security:
      service-auth:
        enabled: ${TSB_COMMON_SERVICE_AUTH_ENABLED:false}
        service-code: common-service
        issuer-uri: ${AUTH_KEYCLOAK_INTERNAL_ISSUER_URI:http://localhost:8088/realms/truongsonbank}
        jwk-set-uri: ${AUTH_KEYCLOAK_JWKS_URI:http://localhost:8088/realms/truongsonbank/protocol/openid-connect/certs}
        expected-audience: common-service
    config:
      admin-api-key: ${COMMON_CONFIG_ADMIN_API_KEY:local-admin-key}
      bootstrap-clients:
        client: ${CLIENT_CONFIG_API_KEY:local-config-key}
      redis-channel: tsb:config:changed
    entitlement:
      redis-channel: ${COMMON_ENTITLEMENT_REDIS_CHANNEL:tsb:entitlement:changed}
