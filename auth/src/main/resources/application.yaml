spring:
  application:
    name: auth
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${AUTH_DB_NAME:authdb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: client
    password: clientpass
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      repositories:
        enabled: false
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${SERVER_PORT:8084}
  servlet:
    context-path: /auth/api

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"

tsb:
  auth:
    session-ttl: ${AUTH_SESSION_TTL:10m}
    biometric-grant-secret: ${AUTH_BIOMETRIC_GRANT_SECRET:local-biometric-grant-secret}
    onboarding-internal-secret: ${AUTH_ONBOARDING_INTERNAL_SECRET:local-onboarding-secret}
    common-base-url: ${AUTH_COMMON_BASE_URL:http://localhost:8083/common/api}
    common-admin-key: ${AUTH_COMMON_ADMIN_KEY:local-admin-key}
    keycloak:
      token-uri: ${AUTH_KEYCLOAK_TOKEN_URI:http://localhost:8088/realms/truongsonbank/protocol/openid-connect/token}
      issuer-uri: ${AUTH_KEYCLOAK_ISSUER_URI:http://localhost:8088/realms/truongsonbank}
      internal-issuer-uri: ${AUTH_KEYCLOAK_INTERNAL_ISSUER_URI:}
      lan-issuer-uri: ${AUTH_KEYCLOAK_LAN_ISSUER_URI:}
      jwks-uri: ${AUTH_KEYCLOAK_JWKS_URI:http://localhost:8088/realms/truongsonbank/protocol/openid-connect/certs}
      mobile-client-id: ${AUTH_KEYCLOAK_MOBILE_CLIENT_ID:truongsonbank-mobile}
      admin-base-url: ${AUTH_KEYCLOAK_ADMIN_BASE_URL:http://localhost:8088}
      admin-realm: ${AUTH_KEYCLOAK_ADMIN_REALM:master}
      realm: ${AUTH_KEYCLOAK_REALM:truongsonbank}
      admin-client-id: ${AUTH_KEYCLOAK_ADMIN_CLIENT_ID:admin-cli}
      admin-username: ${AUTH_KEYCLOAK_ADMIN_USERNAME:admin}
      admin-password: ${AUTH_KEYCLOAK_ADMIN_PASSWORD:admin}
  shared:
    common-config:
      enabled: false
    kafka:
      enabled: false
    cache:
      enabled: false
    sequence:
      enabled: false
    sharding:
      enabled: false
    tracing:
      export-enabled: true
      service-name: auth
      otlp-endpoint: ${TSB_SHARED_TRACING_OTLP_ENDPOINT:http://localhost:4317}
      export-timeout: 5s
    logging:
      request:
        enabled: true
        include-headers: false
        include-query-string: true
        include-body: true
        max-body-length: 4096
        exclude-paths:
          - /actuator/prometheus
          - /actuator/health
      response:
        include-body: true
        max-body-length: 4096
