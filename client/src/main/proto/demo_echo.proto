syntax = "proto3";

package tsb.demo.v1;

option java_multiple_files = true;
option java_package = "vn.com.truongsonbank.grpc.demo";
option java_outer_classname = "DemoEchoProto";

service DemoEchoService {
  rpc Echo(EchoRequest) returns (EchoReply);
}

message EchoRequest {
  string id = 1;
  string message = 2;
}

message EchoReply {
  string id = 1;
  string message = 2;
  string service = 3;
  string timestamp = 4;
}
