spring:
  application:
    name: client
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 2s
      connect-timeout: 2s
      repositories:
        enabled: false
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${CUSTOMER_DB_NAME:customer}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: client
    password: clientpass
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

logging:
  exception-conversion-word: "%ex{full}"
  level:
    root: INFO
    vn.com.truongsonbank: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    com.zaxxer.hikari: INFO

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: "health,metrics,prometheus"

tsb:
  customer:
    onboarding:
      common-base-url: ${COMMON_BASE_URL:http://localhost:8083/common/api}
      auth-base-url: ${AUTH_BASE_URL:http://localhost:8084/auth/api}
      core-base-url: ${CORE_BASE_URL:http://localhost:8085}
      auth-internal-secret: ${AUTH_ONBOARDING_INTERNAL_SECRET:local-onboarding-secret}
      entitlement-admin-key: ${ENTITLEMENT_ADMIN_KEY:local-admin-key}
      default-service-package: ${DEFAULT_SERVICE_PACKAGE:STANDARD}
      session-ttl: 15m
      otp-ttl: 5m
  config:
    enabled: true
    server-url: ${TSB_CONFIG_SERVER_URL:http://localhost:8083/common/api}
    app: client
    profile: local
    api-key: ${CONFIG_CLIENT_API_KEY:local-config-key}
    polling-interval: 30s
    redis:
      enabled: true
      channel: tsb:config:changed
  shared:
    internal-auth:
      enabled: true
      signer-enabled: false
      verifier-enabled: true
      hmac-secret: ${TSB_SHARED_INTERNAL_AUTH_HMAC_SECRET:local-dev-secret}
      issuer: bff
      max-skew: 60s
      excluded-paths:
        - /actuator
        - /v3/api-docs
        - /swagger-ui
        - /swagger-ui.html
        - /v1/onboarding
    tracing:
      export-enabled: true
      service-name: client
      otlp-endpoint: ${TSB_SHARED_TRACING_OTLP_ENDPOINT:http://localhost:4317}
      export-timeout: 5s
    kafka:
      bootstrap-servers:
        - ${TSB_SHARED_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
      client-id: client
      group-id: client
      outbox:
        enabled: true
        relay-enabled: true
        auto-create-table: true
        table-name: tsb_outbox_event
        batch-size: 10
        poll-interval-ms: 1000
        max-attempts: 5
        retry-backoff: 10s
      retry:
        attempts: 3
        backoff: 500ms
      dlq:
        enabled: true
        suffix: .DLQ
    sequence:
      mode: self
      node-id: 1
      key-prefix: tsb:seq
    crypto:
      enabled: true
      key-id: local-v1
      encryption-key: ${TSB_CRYPTO_ENCRYPTION_KEY:bG9jYWwtZGVtby1lbmMta2V5LTEyMzQ1Njc4OTAxMjM=}
      hash-key: ${TSB_CRYPTO_HASH_KEY:bG9jYWwtZGVtby1oYXNoLWtleS0xMjM0NTY3ODkwMTI=}
    sharding:
      enabled: true
      auto-create-table: true
      default-datasource: shard-0
      datasources:
        shard-0:
          url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${CUSTOMER_DB_NAME:customer}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: client
          password: clientpass
        shard-1:
          url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${CUSTOMER_DB_NAME:customer}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
          driver-class-name: com.mysql.cj.jdbc.Driver
          username: client
          password: clientpass
    logging:
      request:
        enabled: true
        include-headers: true
        include-query-string: true
        include-body: true
        max-body-length: 4096
        exclude-paths:
          - /actuator/prometheus
      response:
        include-body: true
        max-body-length: 4096
      mask-rules:
        username:
          keys: "username"
          keep-first: 1
          keep-last: 1
          mask-char: "-"
        phone:
          keys: "phone,phoneNumber,mobile,sdt"
          keep-first: 2
          keep-last: 4
          mask-char: "*"
        card:
          keys: "pan,cardNumber"
          keep-first: 6
          keep-last: 4
          mask-char: "*"
    cache:
      key-prefix: "client"
      l1:
        enabled: true
        maximum-size: 1000
        ttl: 10m
        soft-ttl: 5m
        null-ttl: 30s
      l2:
        enabled: true
        ttl: 30m
        soft-ttl: 10m
        null-ttl: 30s
      invalidation:
        enabled: true
        channel: tsb-cache-invalidation
      tracking:
        enabled: true
        configure-notify-keyspace-events: true
    protocol:
      discovery:
        enabled: true
        provider: consul
        consul-url: http://consul:8500
        registration:
          enabled: true
          service-id: client-http
          service-name: client
          address: client
          port: 8081
          health-path: /actuator/health
      downstreams:
        client-self:
          base-url: http://localhost:8081
        client2:
          enabled: false
          service-id: client2
          base-url: http://client2:8082
        client2-grpc:
          enabled: false
          service-id: client2-grpc
          target: client2:9092
          response-timeout: 1s
