services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: tsb-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  client:
    build:
      context: ../client
    container_name: tsb-client
    command:
      - --tsb.shared.protocol.downstreams.client2-grpc.target=client2:9092
    depends_on:
      mysql:
        condition: service_healthy
      common:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      consul:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATA_REDIS_HOST: redis
      TSB_SHARED_TRACING_OTLP_ENDPOINT: http://otel-collector:4317
      TSB_SHARED_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TSB_SHARED_KAFKA_CLIENT_ID: client
      TSB_SHARED_KAFKA_GROUP_ID: client
      TSB_CONFIG_SERVER_URL: http://common:8083
      CONFIG_CLIENT_API_KEY: local-config-key
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      CLIENT_DB_NAME: clientdb

  common:
    build:
      context: ../common
    container_name: tsb-common
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      COMMON_DB_NAME: commondb
      SPRING_DATA_REDIS_HOST: redis
      TSB_SHARED_TRACING_OTLP_ENDPOINT: http://otel-collector:4317
      COMMON_CONFIG_ADMIN_API_KEY: local-admin-key
      CLIENT_CONFIG_API_KEY: local-config-key

  client2:
    build:
      context: ../client2
    container_name: tsb-client2
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
      consul:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure
    ports:
      - "8082:8082"
      - "19093:9092"
    environment:
      SERVER_PORT: 8082
      SPRING_DATA_REDIS_HOST: redis
      TSB_SHARED_TRACING_OTLP_ENDPOINT: http://otel-collector:4317
      TSB_SHARED_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TSB_SHARED_KAFKA_CLIENT_ID: client2
      TSB_SHARED_KAFKA_GROUP_ID: client2

  consul:
    image: hashicorp/consul:1.20
    container_name: tsb-consul
    command: ["agent", "-dev", "-client=0.0.0.0", "-config-dir=/consul/config"]
    ports:
      - "8500:8500"
    volumes:
      - ../monitoring/consul:/consul/config

  kafka:
    image: apache/kafka:3.9.0
    container_name: tsb-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: tsb-kafka-ui
    depends_on:
      - kafka
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  mysql:
    image: mysql:8.4
    container_name: tsb-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: clientdb
      MYSQL_USER: client
      MYSQL_PASSWORD: clientpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql-data:/var/lib/mysql
      - ../deployment/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: tsb-compose-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--dir", "/tmp"]

  redis-insight:
    image: redis/redisinsight:latest
    container_name: tsb-redis-insight
    depends_on:
      - redis
    ports:
      - "5540:5540"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tsb-tempo
    user: "0"
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/tmp/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: tsb-otel-collector
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    depends_on:
      - tempo
      - loki
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../monitoring/otel-collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro

  loki:
    image: grafana/loki:3.3.2
    container_name: tsb-loki
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.3.2
    container_name: tsb-promtail
    command:
      - -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    volumes:
      - ../monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.5.1
    container_name: tsb-grafana
    depends_on:
      - prometheus
      - tempo
      - loki
      - promtail
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  mysql-data:
