services:
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: tsb-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  client:
    build:
      context: ../client
    container_name: tsb-client
    command:
      - --tsb.shared.protocol.downstreams.client2-grpc.target=client2:9092
    depends_on:
      mysql:
        condition: service_healthy
      common:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
      consul:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATA_REDIS_HOST: redis
      TSB_SHARED_TRACING_OTLP_ENDPOINT: http://otel-collector:4317
      TSB_SHARED_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TSB_SHARED_KAFKA_CLIENT_ID: client
      TSB_SHARED_KAFKA_GROUP_ID: client
      TSB_CONFIG_SERVER_URL: http://common:8083/common/api
      CONFIG_CLIENT_API_KEY: local-config-key
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      CUSTOMER_DB_NAME: customer
      COMMON_BASE_URL: http://common:8083/common/api
      AUTH_BASE_URL: http://auth:8084/auth/api
      CORE_BASE_URL: http://core:8085
      AUTH_ONBOARDING_INTERNAL_SECRET: local-onboarding-secret

  core:
    build:
      context: ../core
    container_name: tsb-core
    depends_on:
      mysql:
        condition: service_healthy
      t29:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      CORE_DB_NAME: coredb
      SPRING_DATA_REDIS_HOST: redis
      T29_BASE_URL: http://t29:8087
      TSB_SHARED_TRACING_OTLP_ENDPOINT: http://otel-collector:4317

  t29:
    build:
      context: ../t29
    container_name: tsb-t29
    restart: on-failure
    ports:
      - "8087:8087"
    environment:
      SERVER_PORT: 8087

  common:
    build:
      context: ../common
    container_name: tsb-common
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      COMMON_DB_NAME: commondb
      SPRING_DATA_REDIS_HOST: redis
      TSB_SHARED_TRACING_OTLP_ENDPOINT: http://otel-collector:4317
      COMMON_CONFIG_ADMIN_API_KEY: local-admin-key
      CLIENT_CONFIG_API_KEY: local-config-key

  keycloak:
    build:
      context: ../keycloak-biometric-provider
    container_name: tsb-keycloak
    command:
      - start-dev
      - --features=dpop
      - --http-enabled=true
      - --hostname-strict=false
      - --import-realm
    depends_on:
      mysql:
        condition: service_healthy
    restart: on-failure
    ports:
      - "8088:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloakdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      KC_DB_USERNAME: client
      KC_DB_PASSWORD: clientpass
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      JAVA_OPTS_KC_HEAP: "-XX:InitialHeapSize=128m -XX:MaxHeapSize=512m"
      TSB_AUTH_BIOMETRIC_VERIFY_URL: http://auth:8084/auth/api/v1/internal/biometric/verify
      TSB_AUTH_BIOMETRIC_SECRET: local-biometric-grant-secret
    volumes:
      - ../deployment/keycloak:/opt/keycloak/data/import:ro

  auth:
    build:
      context: ../auth
    container_name: tsb-auth
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      keycloak:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      AUTH_DB_NAME: authdb
      SPRING_DATA_REDIS_HOST: redis
      TSB_SHARED_TRACING_OTLP_ENDPOINT: http://otel-collector:4317
      AUTH_KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/truongsonbank/protocol/openid-connect/token
      AUTH_KEYCLOAK_ADMIN_BASE_URL: http://keycloak:8080
      AUTH_KEYCLOAK_ISSUER_URI: http://localhost:8088/realms/truongsonbank
      AUTH_KEYCLOAK_INTERNAL_ISSUER_URI: http://keycloak:8080/realms/truongsonbank
      AUTH_KEYCLOAK_LAN_ISSUER_URI: http://192.168.0.101:8088/realms/truongsonbank
      AUTH_KEYCLOAK_JWKS_URI: http://keycloak:8080/realms/truongsonbank/protocol/openid-connect/certs
      AUTH_KEYCLOAK_MOBILE_CLIENT_ID: truongsonbank-mobile
      AUTH_BIOMETRIC_GRANT_SECRET: local-biometric-grant-secret
      AUTH_ONBOARDING_INTERNAL_SECRET: local-onboarding-secret

  bff:
    build:
      context: ../bff
    container_name: tsb-bff
    depends_on:
      auth:
        condition: service_started
      common:
        condition: service_started
      redis:
        condition: service_started
      consul:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure
    ports:
      - "8086:8080"
    environment:
      SERVER_PORT: 8080
      SPRING_DATA_REDIS_HOST: redis
      TSB_SHARED_TRACING_OTLP_ENDPOINT: http://otel-collector:4317
      TSB_SHARED_PROTOCOL_DISCOVERY_CONSUL_URL: http://consul:8500
      TSB_SHARED_PROTOCOL_DOWNSTREAMS_COMMON_BASE_URL: http://common:8083/common/api
      TSB_SHARED_PROTOCOL_DOWNSTREAMS_CLIENT_BASE_URL: http://client:8081
      TSB_SHARED_PROTOCOL_DOWNSTREAMS_CORE_BASE_URL: http://core:8085/core/api
      TSB_SHARED_INTERNAL_AUTH_HMAC_SECRET: local-dev-secret
      BFF_ROUTE_CLIENT_URI: http://client:8081
      BFF_ROUTE_COMMON_URI: http://common:8083
      BFF_ROUTE_AUTH_URI: http://auth:8084

  client2:
    build:
      context: ../client2
    container_name: tsb-client2
    depends_on:
      kafka:
        condition: service_started
      redis:
        condition: service_started
      consul:
        condition: service_started
      otel-collector:
        condition: service_started
    restart: on-failure
    ports:
      - "8082:8082"
      - "19093:9092"
    environment:
      SERVER_PORT: 8082
      SPRING_DATA_REDIS_HOST: redis
      TSB_SHARED_TRACING_OTLP_ENDPOINT: http://otel-collector:4317
      TSB_SHARED_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      TSB_SHARED_KAFKA_CLIENT_ID: client2
      TSB_SHARED_KAFKA_GROUP_ID: client2

  consul:
    image: hashicorp/consul:1.20
    container_name: tsb-consul
    command: ["agent", "-dev", "-client=0.0.0.0", "-config-dir=/consul/config"]
    ports:
      - "8500:8500"
    volumes:
      - ../monitoring/consul:/consul/config

  kafka:
    image: apache/kafka:3.9.0
    container_name: tsb-kafka
    ports:
      - "19092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: tsb-kafka-ui
    depends_on:
      - kafka
    ports:
      - "18080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  mysql:
    image: mysql:8.4
    container_name: tsb-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: clientdb
      MYSQL_USER: client
      MYSQL_PASSWORD: clientpass
      MYSQL_ROOT_PASSWORD: rootpass
    volumes:
      - mysql-data:/var/lib/mysql
      - ../deployment/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -prootpass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: tsb-compose-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no", "--dir", "/tmp"]

  redis-insight:
    image: redis/redisinsight:latest
    container_name: tsb-redis-insight
    depends_on:
      - redis
    ports:
      - "5540:5540"

  tempo:
    image: grafana/tempo:2.6.1
    container_name: tsb-tempo
    user: "0"
    command:
      - -config.file=/etc/tempo/tempo.yml
    ports:
      - "3200:3200"
    volumes:
      - ../monitoring/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/tmp/tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    container_name: tsb-otel-collector
    command:
      - --config=/etc/otelcol-contrib/otel-collector.yml
    depends_on:
      - tempo
      - loki
    ports:
      - "4317:4317"
      - "4318:4318"
    volumes:
      - ../monitoring/otel-collector/otel-collector.yml:/etc/otelcol-contrib/otel-collector.yml:ro

  loki:
    image: grafana/loki:3.3.2
    container_name: tsb-loki
    command:
      - -config.file=/etc/loki/loki.yml
    ports:
      - "3100:3100"
    volumes:
      - ../monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.3.2
    container_name: tsb-promtail
    command:
      - -config.file=/etc/promtail/promtail.yml
    depends_on:
      - loki
    volumes:
      - ../monitoring/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  grafana:
    image: grafana/grafana:11.5.1
    container_name: tsb-grafana
    depends_on:
      - prometheus
      - tempo
      - loki
      - promtail
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  prometheus-data:
  grafana-data:
  tempo-data:
  loki-data:
  mysql-data:
